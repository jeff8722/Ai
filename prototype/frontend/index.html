<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VESTIQ prototype</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d1b18;
        --muted: #5c564d;
        --paper: #f5f1ea;
        --card: #ffffff;
        --line: #d8d1c5;
        --accent: #7a1f3d;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); }
      main { display: grid; gap: 20px; padding: 20px; min-height: 100vh; align-content: start; }
      @media (min-width: 1000px) and (orientation: landscape) {
        main { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
        header, footer { grid-column: 1 / -1; }
      }
      header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      h1 { margin: 0; font-size: 28px; letter-spacing: 0.08em; }
      h2 { margin: 0 0 12px; font-size: 22px; }
      h3 { margin: 20px 0 10px; font-size: 18px; color: var(--muted); }
      button, .button {
        font: inherit; font-size: 18px; min-height: 52px; padding: 0 20px;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        border: 2px solid var(--ink); border-radius: 10px; background: var(--card); color: var(--ink); cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button:focus-visible, .button:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .stage { display: grid; gap: 12px; align-content: start; }
      .frame {
        aspect-ratio: 3 / 4; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
        display: grid; place-items: center; overflow: hidden; color: var(--muted); text-align: center; padding: 0;
      }
      .frame img { width: 100%; height: 100%; object-fit: contain; }
      .note { margin: 0; color: var(--muted); font-size: 15px; }
      .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
      .tabs button[aria-pressed='true'] { background: var(--ink); color: #fff; }
      .grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .garment { width: 100%; height: 100%; flex-direction: column; padding: 8px; border-color: var(--line); }
      .garment[aria-pressed='true'] { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
      .garment img { width: 100%; aspect-ratio: 3 / 4; object-fit: contain; }
      .garment span { font-size: 15px; line-height: 1.3; text-align: center; }
      footer { position: sticky; bottom: 0; background: var(--paper); padding: 12px 0 4px; }
      .primary { width: 100%; min-height: 64px; font-size: 20px; background: var(--accent); border-color: var(--accent); color: #fff; }
      .error { margin: 8px 0 0; color: #a3122a; font-weight: 600; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
